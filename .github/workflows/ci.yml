name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'test/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout tests repo
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Install Allure CLI and Java
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jre-headless
          wget https://github.com/allure-framework/allure2/releases/download/2.42.0/allure-2.42.0.tgz
          tar -xzf allure-2.42.0.tgz
          sudo mv allure-2.42.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: CodeCaballero/cypress-realworld-app
          path: app
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install app dependencies
        run: |
          cd app
          yarn install --frozen-lockfile

      - name: Seed database
        run: |
          cd app
          yarn db:seed:dev

      - name: Start app
        run: |
          cd app
          yarn dev &
          npx wait-on http://localhost:3000 http://localhost:3001 --timeout 60000
          echo "Checking WEB health..."
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000 || exit 1

      - name: Run tests API
        run: |
          echo -e "\033[92mRUN TEST API\033[0m"
          uv run pytest test/api/ -v --alluredir=allure-results
        env:
          WEB_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001

      - name: Run tests WEB
        run: |
      - name: Run tests WEB
        run: |
          echo -e "\033[92mRUN TEST WEB\033[0m"
          uv run pytest test/web/ -v \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --alluredir=allure-results
        env:
          WEB_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001

      - name: Load previous report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        run: |
          # Copy history if exists
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history allure-results/ || true
          fi
          allure generate allure-results -o allure-report --clean

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            allure-results/
          if-no-files-found: ignore
          retention-days: 7
